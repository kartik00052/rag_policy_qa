services:
  postgres:
    image: postgres:16-alpine
    container_name: rag_policy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_policy
    # Host port 5434 maps to container port 5432. 5434 is used to prevent
    # port conflict with native Windows PostgreSQL service running on host 5432,
    # matching DATABASE_URL in backend/.env.
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # The backend entrypoint runs `alembic upgrade head` before uvicorn, so the
    # migration needs a live server to connect to. `depends_on: service_healthy`
    # is what makes that ordering real - a plain `depends_on` only waits for the
    # container to start, and the backend would then fail migrations on a
    # not-yet-accepting-connections database and never come back up.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_policy"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_policy_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        - CMD-SHELL
        - bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: rag_policy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # No minio service: project.md Section 2 keeps raw uploads on local disk under
  # backend/storage/ and lists MinIO/S3 as explicitly out of scope for V1. The
  # service was also unpullable, so `docker compose up` failed outright.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_policy_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/rag_policy
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      # Ollama is a host process, not a compose service (project.md Section 4
      # containerizes Postgres/Qdrant/Redis/backend/frontend only). Inside the
      # container the host is reachable as host.docker.internal - the
      # extra_hosts mapping below makes that name resolve on Linux daemons too,
      # not just on Windows/macOS where it is built in.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_policy_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
