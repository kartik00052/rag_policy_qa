<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Policy RAG Assistant — grounded answers from your policy corpus</title>
  <desc id="bannerDesc">Ask questions in plain language; the system retrieves hybrid evidence, gates it, and streams a cited answer or an honest refusal.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.5" stop-color="#111c38"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <g opacity="0.5">
    <circle cx="1088" cy="64" r="70" fill="none" stroke="url(#textGrad)" stroke-opacity="0.28" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="0 1088 64" to="360 1088 64" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="112" cy="296" r="90" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="1.5">
      <animateTransform attributeName="transform" type="rotate" from="360 112 296" to="0 112 296" dur="50s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="600" y="56" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="800" letter-spacing="0.5" fill="url(#textGrad)">Policy RAG Assistant</text>
  <text x="600" y="84" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#8fa3c8">Ask questions in plain language — answers are grounded in your policy corpus, cited, and streamed.</text>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <g>
      <rect x="145" y="144" width="150" height="46" rx="12" fill="#0f1b33" stroke="#22d3ee" stroke-opacity="0.65" stroke-width="1.4"/>
      <text x="220" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eefb">Ask a question</text>
      <text x="220" y="181" text-anchor="middle" font-size="11" fill="#7c8db5">plain language</text>
    </g>
    <g>
      <rect x="335" y="144" width="150" height="46" rx="12" fill="#0f1b33" stroke="#22d3ee" stroke-opacity="0.65" stroke-width="1.4"/>
      <text x="410" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eefb">FastAPI API</text>
      <text x="410" y="181" text-anchor="middle" font-size="11" fill="#7c8db5">async REST + SSE</text>
    </g>
    <g>
      <rect x="525" y="144" width="150" height="46" rx="12" fill="#0f1b33" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="1.4"/>
      <text x="600" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eefb">Hybrid RAG</text>
      <text x="600" y="181" text-anchor="middle" font-size="11" fill="#a78bfa">dense + sparse · RRF</text>
    </g>
    <g>
      <rect x="715" y="144" width="150" height="46" rx="12" fill="#0f1b33" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="1.4"/>
      <text x="790" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eefb">LLM</text>
      <text x="790" y="181" text-anchor="middle" font-size="11" fill="#a78bfa">grounded + cited</text>
    </g>
    <g>
      <rect x="905" y="144" width="150" height="46" rx="12" fill="#0f1b33" stroke="#34d399" stroke-opacity="0.7" stroke-width="1.4"/>
      <text x="980" y="165" text-anchor="middle" font-size="15" font-weight="600" fill="#e8eefb">Cited answer</text>
      <text x="980" y="181" text-anchor="middle" font-size="11" fill="#6ee7b7">streamed via SSE</text>
    </g>
  </g>

  <g stroke="url(#lineGrad)" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 300 167 L 330 167" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 490 167 L 520 167" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.1s" begin="0.28s" repeatCount="indefinite"/>
    </path>
    <path d="M 680 167 L 710 167" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.1s" begin="0.56s" repeatCount="indefinite"/>
    </path>
    <path d="M 870 167 L 900 167" stroke-dasharray="10 14">
      <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.1s" begin="0.84s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#glow)">
    <circle cx="300" cy="167" r="3.6" fill="#22d3ee">
      <animateMotion dur="1.1s" repeatCount="indefinite" path="M 300 167 L 326 167"/>
    </circle>
    <circle cx="490" cy="167" r="3.6" fill="#7dd3fc">
      <animateMotion dur="1.1s" begin="0.28s" repeatCount="indefinite" path="M 490 167 L 516 167"/>
    </circle>
    <circle cx="680" cy="167" r="3.6" fill="#a78bfa">
      <animateMotion dur="1.1s" begin="0.56s" repeatCount="indefinite" path="M 680 167 L 706 167"/>
    </circle>
    <circle cx="870" cy="167" r="3.6" fill="#a78bfa">
      <animateMotion dur="1.1s" begin="0.84s" repeatCount="indefinite" path="M 870 167 L 896 167"/>
    </circle>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#cbd5e1">
    <g><rect x="80" y="248" width="196" height="26" rx="13" fill="#0f1b33" stroke="#223456" stroke-width="1"/><text x="178" y="265" text-anchor="middle">Python 3.11</text></g>
    <g><rect x="300" y="248" width="196" height="26" rx="13" fill="#0f1b33" stroke="#223456" stroke-width="1"/><text x="398" y="265" text-anchor="middle">FastAPI</text></g>
    <g><rect x="520" y="248" width="196" height="26" rx="13" fill="#0f1b33" stroke="#223456" stroke-width="1"/><text x="618" y="265" text-anchor="middle">PostgreSQL 16</text></g>
    <g><rect x="740" y="248" width="196" height="26" rx="13" fill="#0f1b33" stroke="#223456" stroke-width="1"/><text x="838" y="265" text-anchor="middle">Qdrant</text></g>
    <g><rect x="960" y="248" width="196" height="26" rx="13" fill="#0f1b33" stroke="#223456" stroke-width="1"/><text x="1058" y="265" text-anchor="middle">Redis</text></g>
    <g><rect x="80" y="292" width="196" height="26" rx="13" fill="#0f1b33" stroke="#223456" stroke-width="1"/><text x="178" y="309" text-anchor="middle">Docling</text></g>
    <g><rect x="300" y="292" width="196" height="26" rx="13" fill="#0f1b33" stroke="#223456" stroke-width="1"/><text x="398" y="309" text-anchor="middle">LangGraph</text></g>
    <g><rect x="520" y="292" width="196" height="26" rx="13" fill="#0f1b33" stroke="#223456" stroke-width="1"/><text x="618" y="309" text-anchor="middle">React 19 + Vite</text></g>
    <g><rect x="740" y="292" width="196" height="26" rx="13" fill="#0f1b33" stroke="#223456" stroke-width="1"/><text x="838" y="309" text-anchor="middle">Tailwind CSS</text></g>
    <g><rect x="960" y="292" width="196" height="26" rx="13" fill="#0f1b33" stroke="#223456" stroke-width="1"/><text x="1058" y="309" text-anchor="middle">shadcn / UI</text></g>
  </g>
</svg>